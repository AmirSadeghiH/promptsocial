{% extends "web/base.html" %}
{% block title %}Sign up · Promptly{% endblock %}

{% block content %}
<div class="auth-card">
  <h1>Create your account</h1>
  <p class="muted">Join the community of prompt creators.</p>
  {% if error %}<div class="form-error">{{ error }}</div>{% endif %}
  <form method="post" class="auth-form">
    {% csrf_token %}
    <label class="field"><span>Username</span>
      <input type="text" name="username" required minlength="3" maxlength="150" autocomplete="username">
    </label>
    <label class="field"><span>Email</span>
      <input type="email" name="email" required autocomplete="email">
    </label>
    <label class="field"><span>Password <small>(min 8 chars)</small></span>
      <input type="password" name="password" required minlength="8" autocomplete="new-password">
    </label>
    <button class="btn btn-primary btn-lg" type="submit">Sign up</button>
  </form>
  <p class="muted">Already have an account? <a href="{% url 'login' %}">Log in</a></p>
</div>
{% endblock %}
