{% extends "web/base.html" %}
{% block title %}{{ feed_tab|default:"Home" }} · Promptly{% endblock %}

{% block content %}
<div class="feed-tabs">
  <a class="tab {% if feed_tab == 'foryou' %}active{% endif %}" href="{% url 'web:home' %}">For You</a>
  <a class="tab {% if feed_tab == 'latest' %}active{% endif %}" href="{% url 'web:feed' 'latest' %}">Latest</a>
  <a class="tab {% if feed_tab == 'following' %}active{% endif %}" href="{% url 'web:feed' 'following' %}">Following</a>
  <a class="tab {% if feed_tab == 'trending' %}active{% endif %}" href="{% url 'web:feed' 'trending' %}">Trending</a>
</div>

{% include "web/partials/post_grid.html" %}
{% endblock %}
