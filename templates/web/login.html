{% extends "web/base.html" %}
{% block title %}Log in · Promptly{% endblock %}

{% block content %}
<div class="auth-card">
  <h1>Welcome back</h1>
  <p class="muted">Log in to share prompts, save ideas and follow creators.</p>
  {% if error %}<div class="form-error">{{ error }}</div>{% endif %}
  <form method="post" class="auth-form">
    {% csrf_token %}
    <label class="field"><span>Username or email</span>
      <input type="text" name="username" required autocomplete="username">
    </label>
    <label class="field"><span>Password</span>
      <input type="password" name="password" required autocomplete="current-password">
    </label>
    <button class="btn btn-primary btn-lg" type="submit">Log in</button>
  </form>
  <p class="muted">No account? <a href="{% url 'signup' %}">Sign up</a></p>
</div>
{% endblock %}
